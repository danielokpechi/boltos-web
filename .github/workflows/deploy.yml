name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-next/package-lock.json

      - name: Install dependencies
        working-directory: site-next
        run: npm ci

      # Next.js static export to site-next/out/. BASE_PATH makes every page link
      # and asset path include the /boltos-web/ sub-path (no post-build rewrite).
      - name: Build (Next.js static export)
        working-directory: site-next
        run: npm run build
        env:
          BASE_PATH: /boltos-web

      - name: Disable Jekyll (serve _next/ dir)
        run: touch site-next/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-next/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
